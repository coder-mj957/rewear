
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Product | ReWear</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
            color: #263d32;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, textarea, select {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            background: #263d32;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #3d5c4c;
        }
    </style>
</head>

<body>

<div class="container">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <h1>Add a Product</h1>

    <form th:action="@{/products}" th:object="${product}" method="post">


        <label>Product Name</label>
        <input type="text" th:field="*{name}" placeholder="Enter product name" required>

        <label>Description</label>
        <textarea rows="4" th:field="*{description}" placeholder="Describe your product" required></textarea>

        <label>Price (₹)</label>
        <input type="number" step="0.01" min="0" th:field="*{price}" placeholder="Enter price" required>

        <label>Size</label>
        <select th:field="*{size}" required>
            <option value="">Select size</option>
            <option value="XS">XS</option>
            <option value="S">S</option>
            <option value="M">M</option>
            <option value="L">L</option>
            <option value="XL">XL</option>
            <option value="XXL">XXL</option>
        </select>

        <label>Category</label>
        <select th:field="*{category}" required>
            <option value="">Select category</option>
            <option value="Men">Men</option>
            <option value="Women">Women</option>
            <option value="Kids">Kids</option>
            <option value="Accessories">Accessories</option>
        </select>

        <label>Condition</label>
        <select th:field="*{condition}" required>
            <option value="">Select condition</option>
            <option value="NEW_WITH_TAGS">New with tags</option>
            <option value="LIKE_NEW">Like new</option>
            <option value="GOOD">Good</option>
            <option value="FAIR">Fair</option>
        </select>

        <label>Image URL</label>
        <input type="url" th:field="*{imageUrl}" placeholder="Paste image URL">

        <button type="submit">Add Product</button>

    </form>

</div>

</body>
</html>
