
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ReWear | Buy Now Checkout</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6f2;
            color: #263c32;
        }

        .container {
            max-width: 850px;
            margin: 45px auto;
            padding: 20px;
        }

        .checkout-card {
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.07);
        }

        h1 {
            margin-top: 0;
        }

        .product-summary {
            display: flex;
            gap: 20px;
            align-items: center;
            padding: 18px;
            background: #f5f6f2;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .product-summary img {
            width: 110px;
            height: 110px;
            object-fit: cover;
            border-radius: 8px;
        }

        .product-price {
            color: #286044;
            font-size: 22px;
            font-weight: bold;
        }

        label {
            display: block;
            margin: 17px 0 7px;
            font-weight: 600;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d3d9d3;
            border-radius: 7px;
            font-size: 15px;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        .place-order {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            background: #263c32;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .place-order:hover {
            background: #37634e;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #286044;
            text-decoration: none;
            font-weight: bold;
        }

        @media(max-width: 550px) {
            .product-summary {
                align-items: flex-start;
            }

            .product-summary img {
                width: 85px;
                height: 85px;
            }
        }
    </style>
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">

    <a class="back-link" th:href="@{/products}">
        ← Continue Shopping
    </a>

    <div class="checkout-card">

        <h1>Buy Now Checkout</h1>
        <p>Complete your details to place your order.</p>

        <div class="product-summary">

            <img th:src="${product.imageUrl}"
                 th:alt="${product.name}">

            <div>
                <h3 th:text="${product.name}"></h3>

                <p>
                    Quantity: 1
                </p>

                <p class="product-price">
                    ₹<span th:text="${product.price}"></span>
                </p>
            </div>

        </div>

        <form th:action="@{/checkout/buy-now/{id}(id=${product.id})}"
              method="post">

            <label>Full Name</label>
            <input type="text"
                   name="customerName"
                   placeholder="Enter your full name"
                   required>

            <label>Email Address</label>
            <input type="email"
                   name="email"
                   placeholder="Enter your email"
                   required>

            <label>Phone Number</label>
            <input type="tel"
                   name="phone"
                   placeholder="Enter your phone number"
                   required>

            <label>Delivery Address</label>
            <textarea name="address"
                      placeholder="Enter your complete delivery address"
                      required></textarea>

            <button type="submit" class="place-order">
                Place Order
            </button>

        </form>

    </div>

</div>

</body>
</html>
