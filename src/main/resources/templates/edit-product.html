<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Product | ReWear</title>
    <script>
        (function() {
            const theme = localStorage.getItem('rewear-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .form-card {
            background: #ffffff;
            border: 1px solid var(--surface-border-subtle);
            border-radius: var(--radius-xl);
            padding: 40px;
            box-shadow: var(--shadow-md);
            margin: 30px auto;
        }

        .form-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .form-title {
            font-family: var(--font-heading);
            font-size: 28px;
            font-weight: 800;
            color: var(--primary-900);
        }

        .form-subtitle {
            font-size: 15px;
            color: var(--text-secondary);
            margin-top: 6px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        @media (max-width: 600px) {
            .form-card {
                padding: 24px 18px;
            }
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="rw-page-wrap">
    <main class="rw-container rw-container-narrow rw-section">

        <a class="btn btn-secondary btn-sm"
           th:href="@{/products}"
           style="display: inline-flex; align-items: center; gap: 6px; margin-bottom: 20px;">
            ← Back to Products
        </a>

        <div class="form-card">
            <div class="form-header">
                <span style="font-size: 12px; font-weight: 700; color: var(--accent-terracotta); letter-spacing: 2px; text-transform: uppercase;">
                    Manage Listing
                </span>
                <h1 class="form-title">Edit Garment Details</h1>
                <p class="form-subtitle">Update pricing, description, or image for this listed item.</p>
            </div>

            <form th:action="@{/products/update}" th:object="${product}" method="post">

                <input type="hidden" th:field="*{id}">

                <div class="form-group">
                    <label class="form-label">Product Name / Title *</label>
                    <input type="text"
                           class="form-control"
                           th:field="*{name}"
                           required>
                </div>

                <div class="form-group">
                    <label class="form-label">Garment Description *</label>
                    <textarea class="form-control"
                              rows="4"
                              th:field="*{description}"
                              required></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Price (₹) *</label>
                        <input type="number"
                               step="0.01"
                               min="0"
                               class="form-control"
                               th:field="*{price}"
                               required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Size *</label>
                        <select class="form-select" th:field="*{size}" required>
                            <option value="XS">XS</option>
                            <option value="S">S</option>
                            <option value="M">M</option>
                            <option value="L">L</option>
                            <option value="XL">XL</option>
                            <option value="XXL">XXL</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Category *</label>
                        <select class="form-select" th:field="*{category}" required>
                            <option value="Men">Men</option>
                            <option value="Women">Women</option>
                            <option value="Kids">Kids</option>
                            <option value="Accessories">Accessories</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Condition *</label>
                        <select class="form-select" th:field="*{condition}" required>
                            <option value="NEW_WITH_TAGS">New with tags</option>
                            <option value="LIKE_NEW">Like new</option>
                            <option value="GOOD">Good</option>
                            <option value="FAIR">Fair</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Photo Image URL</label>
                    <input type="url"
                           class="form-control"
                           th:field="*{imageUrl}">
                </div>

                <div style="margin-top: 28px; display: flex; gap: 14px;">
                    <button type="submit" class="btn btn-primary btn-lg" style="flex: 2;">
                        ✓ Update Garment
                    </button>
                    <a th:href="@{/products}" class="btn btn-secondary btn-lg" style="flex: 1;">
                        Cancel
                    </a>
                </div>

            </form>
        </div>

    </main>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
