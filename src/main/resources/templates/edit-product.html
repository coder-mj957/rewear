
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Product - ReWear</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 550px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, textarea, select {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            box-sizing: border-box;
        }

        button {
            margin-top: 20px;
            padding: 12px;
            width: 100%;
            background: #222;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <h1>Edit Product</h1>

    <form th:action="@{/products/update}" th:object="${product}" method="post">

        <input type="hidden" th:field="*{id}">

        <label>Product Name</label>
        <input type="text" th:field="*{name}" required>

        <label>Description</label>
        <textarea th:field="*{description}" required></textarea>

        <label>Price (₹)</label>
        <input type="number" step="0.01" min="0" th:field="*{price}" required>

        <label>Size</label>
        <select th:field="*{size}" required>
            <option value="XS">XS</option>
            <option value="S">S</option>
            <option value="M">M</option>
            <option value="L">L</option>
            <option value="XL">XL</option>
            <option value="XXL">XXL</option>
        </select>

        <label>Category</label>
        <select th:field="*{category}" required>
            <option value="Men">Men</option>
            <option value="Women">Women</option>
            <option value="Kids">Kids</option>
            <option value="Accessories">Accessories</option>
        </select>

        <label>Condition</label>
        <select th:field="*{condition}" required>
            <option value="NEW_WITH_TAGS">New with tags</option>
            <option value="LIKE_NEW">Like new</option>
            <option value="GOOD">Good</option>
            <option value="FAIR">Fair</option>
        </select>

        <label>Image URL</label>
        <input type="url" th:field="*{imageUrl}">

        <button type="submit">Update Product</button>

    </form>

</div>

</body>
</html>
