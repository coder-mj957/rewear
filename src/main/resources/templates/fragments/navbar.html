
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>

<div th:fragment="navbar">

    <style>
        .rewear-navbar {
            background: #173f35;
            color: #ffffff;
            padding: 15px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 18px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
            font-family: Arial, sans-serif;
        }

        /* Brand */
        .rewear-brand {
            display: flex;
            flex-direction: column;
            text-decoration: none;
            gap: 3px;
        }

        .rewear-logo {
            color: #ffffff;
            font-size: 27px;
            font-weight: 800;
            letter-spacing: 3px;
        }

        .rewear-tagline {
            color: #c4d9cf;
            font-size: 10px;
            letter-spacing: 2px;
        }

        /* Navigation links */
        .rewear-links {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .rewear-links > a {
            color: #f2f7f4;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            padding: 10px 13px;
            border-radius: 7px;
            transition: all 0.25s ease;
        }

        .rewear-links > a:hover {
            background: rgba(255, 255, 255, 0.13);
            color: #ffffff;
        }

        /* Cart button */
        .rewear-links > a.rewear-cart {
            background: #e8bd78;
            color: #183b31;
            font-weight: 700;
            padding: 10px 18px;
            margin-left: 5px;
        }

        .rewear-links > a.rewear-cart:hover {
            background: #f2d29e;
            transform: translateY(-2px);
        }

        /* Login and register */
        .rewear-auth {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .rewear-auth a {
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            padding: 10px 17px;
            border-radius: 7px;
            transition: all 0.25s ease;
        }

        .rewear-login {
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .rewear-login:hover {
            background: white;
            color: #173f35;
        }

        .rewear-register {
            color: #173f35;
            background: #e8bd78;
        }

        .rewear-register:hover {
            background: #f2d29e;
        }

        /* Logged-in user section */
        .rewear-user {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-left: 12px;
            border-left: 1px solid rgba(255, 255, 255, 0.3);
        }

        .rewear-username {
            color: #e1ece6;
            font-size: 13px;
        }

        .rewear-logout-form {
            margin: 0;
        }

        .rewear-logout {
            background: transparent;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.6);
            padding: 9px 15px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.25s ease;
        }

        .rewear-logout:hover {
            background: #ffffff;
            color: #173f35;
        }

        /* Mobile responsive layout */
        @media (max-width: 900px) {
            .rewear-navbar {
                justify-content: center;
                padding: 18px 4%;
            }

            .rewear-links {
                width: 100%;
                gap: 5px;
            }

            .rewear-user {
                border-left: none;
                padding-left: 0;
            }
        }

        @media (max-width: 550px) {
            .rewear-links > a {
                font-size: 13px;
                padding: 9px 10px;
            }

            .rewear-auth {
                flex-wrap: wrap;
                justify-content: center;
            }

            .rewear-user {
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>

    <nav class="rewear-navbar">

        <!-- Logo -->
        <a class="rewear-brand" th:href="@{/}">
            <span class="rewear-logo">REWEAR.</span>
            <span class="rewear-tagline">FASHION WITH A SECOND LIFE</span>
        </a>

        <!-- Main navigation -->
        <div class="rewear-links">

            <a th:href="@{/}">Home</a>

            <a th:href="@{/products}">Explore Products</a>

            <!-- Customer-only links -->
            <a sec:authorize="isAuthenticated()"
               th:href="@{/orders}">
                My Orders
            </a>

            <a sec:authorize="isAuthenticated()"
               class="rewear-cart"
               th:href="@{/cart}">
                🛒 Cart
            </a>

            <!-- Admin-only links -->
            <a sec:authorize="hasRole('ADMIN')"
               th:href="@{/products/new}">
                + Add Product
            </a>

            <a sec:authorize="hasRole('ADMIN')"
               th:href="@{/admin/orders}">
                Admin Dashboard
            </a>

        </div>

        <!-- Guest links -->
        <div class="rewear-auth" sec:authorize="isAnonymous()">

            <a class="rewear-login" th:href="@{/login}">
                Login
            </a>

            <a class="rewear-register" th:href="@{/register}">
                Register
            </a>

        </div>

        <!-- Logged-in user controls -->
        <div class="rewear-user" sec:authorize="isAuthenticated()">

            <span class="rewear-username">
                Welcome,
                <strong sec:authentication="name"></strong>
            </span>

            <form class="rewear-logout-form"
                  th:action="@{/logout}"
                  method="post">

                <button class="rewear-logout" type="submit">
                    Logout ↗
                </button>

            </form>

        </div>

    </nav>

</div>

</body>
</html>
