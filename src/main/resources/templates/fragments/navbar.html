<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>

<div th:fragment="navbar">
    <nav class="rw-navbar">
        <div class="rw-container rw-navbar-inner">

            <!-- Brand Logo -->
            <a class="rw-brand" th:href="@{/}">
                <span class="rw-brand-name">
                    REWEAR<span class="rw-brand-dot"></span>
                </span>
                <span class="rw-brand-tagline">Fashion With A Second Life</span>
            </a>

            <!-- Mobile menu trigger -->
            <button class="rw-mobile-toggle" id="rwMobileToggle" aria-label="Toggle Navigation" onclick="document.getElementById('rwNavMenu').classList.toggle('show')">
                ☰
            </button>

            <!-- Navigation Links -->
            <div class="rw-nav-menu" id="rwNavMenu">

                <a class="rw-nav-link" th:href="@{/}">
                    Home
                </a>

                <a class="rw-nav-link" th:href="@{/products}">
                    Explore Products
                </a>

                <!-- Customer-only links -->
                <a class="rw-nav-link"
                   sec:authorize="isAuthenticated()"
                   th:href="@{/orders}">
                    My Orders
                </a>

                <a class="rw-nav-link rw-nav-cart"
                   sec:authorize="isAuthenticated()"
                   th:href="@{/cart}">
                    🛒 Cart
                </a>

                <!-- Admin-only links -->
                <a class="rw-nav-link"
                   sec:authorize="hasRole('ADMIN')"
                   th:href="@{/products/new}">
                    + Add Product
                </a>

                <a class="rw-nav-link"
                   sec:authorize="hasRole('ADMIN')"
                   th:href="@{/admin/orders}">
                    Admin Dashboard
                </a>

                <!-- Theme Toggle Button -->
                <button type="button"
                        class="rw-theme-toggle"
                        id="rwThemeToggle"
                        onclick="rwToggleTheme()"
                        aria-label="Toggle light and dark mode"
                        title="Switch between Light and Dark mode">
                    <span class="rw-theme-toggle-icon" id="rwThemeIcon">🌙</span>
                    <span id="rwThemeLabel">Dark</span>
                </button>

                <!-- Guest Links -->
                <div class="rw-nav-auth" sec:authorize="isAnonymous()">
                    <a class="rw-btn-nav-login" th:href="@{/login}">
                        Login
                    </a>
                    <a class="rw-btn-nav-register" th:href="@{/register}">
                        Register
                    </a>
                </div>

                <!-- Logged-in User Info & Logout -->
                <div class="rw-nav-user" sec:authorize="isAuthenticated()">
                    <div class="rw-user-badge">
                        <span class="rw-user-avatar">👤</span>
                        <span>
                            Welcome, <strong sec:authentication="name"></strong>
                        </span>
                    </div>

                    <form th:action="@{/logout}" method="post" style="margin: 0; display: inline;">
                        <button class="rw-nav-logout-btn" type="submit">
                            Logout ↗
                        </button>
                    </form>
                </div>

            </div>
        </div>
    </nav>

    <!-- Client-side Theme Switcher Script -->
    <script>
        function rwGetStoredTheme() {
            return localStorage.getItem('rewear-theme') ||
                (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        }

        function rwApplyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            const icon = document.getElementById('rwThemeIcon');
            const label = document.getElementById('rwThemeLabel');
            if (icon && label) {
                if (theme === 'dark') {
                    icon.textContent = '☀️';
                    label.textContent = 'Light';
                } else {
                    icon.textContent = '🌙';
                    label.textContent = 'Dark';
                }
            }
        }

        function rwToggleTheme() {
            const current = document.documentElement.getAttribute('data-theme') || rwGetStoredTheme();
            const next = current === 'dark' ? 'light' : 'dark';
            localStorage.setItem('rewear-theme', next);
            rwApplyTheme(next);
        }

        // Synchronize on load
        (function() {
            rwApplyTheme(rwGetStoredTheme());
        })();
    </script>
</div>

</body>
</html>
