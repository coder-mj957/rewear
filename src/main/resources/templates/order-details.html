<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Order #' + ${order.id} + ' Details | ReWear'">Order Details | ReWear</title>
    <script>
        (function() {
            const theme = localStorage.getItem('rewear-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .invoice-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 24px;
        }

        @media (max-width: 768px) {
            .invoice-grid {
                grid-template-columns: 1fr;
            }
        }

        .invoice-info-card {
            background: #ffffff;
            border: 1px solid var(--surface-border-subtle);
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: var(--shadow-sm);
        }

        .invoice-card-title {
            font-family: var(--font-heading);
            font-size: 16px;
            font-weight: 700;
            color: var(--primary-900);
            margin-bottom: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--surface-border-subtle);
            font-size: 14px;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-row-label {
            color: var(--text-muted);
            font-weight: 600;
        }

        .info-row-val {
            color: var(--text-primary);
            font-weight: 700;
            text-align: right;
        }

        /* Items Container */
        .items-card {
            background: #ffffff;
            border: 1px solid var(--surface-border-subtle);
            border-radius: var(--radius-xl);
            padding: 30px;
            box-shadow: var(--shadow-sm);
            margin-bottom: 28px;
        }

        .order-item-row {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 16px 0;
            border-bottom: 1px solid var(--surface-border-subtle);
        }

        .order-item-row:last-child {
            border-bottom: none;
        }

        .order-item-thumb {
            width: 80px;
            height: 85px;
            object-fit: cover;
            border-radius: var(--radius-md);
            background: #eeebe3;
            flex-shrink: 0;
        }

        .order-item-details {
            flex-grow: 1;
        }

        .order-item-subtotal {
            text-align: right;
            font-family: var(--font-heading);
            font-size: 18px;
            font-weight: 800;
            color: var(--primary-900);
        }

        .order-grand-total-box {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding-top: 20px;
            border-top: 2px dashed var(--surface-border);
            margin-top: 10px;
        }
    </style>
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="rw-page-wrap">
    <main class="rw-container rw-container-medium rw-section">

        <a class="btn btn-secondary btn-sm"
           th:href="@{/orders}"
           style="display: inline-flex; align-items: center; gap: 6px; margin-bottom: 20px;">
            ← Back to Order History
        </a>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px;">
            <div>
                <span style="font-size: 12px; font-weight: 700; color: var(--accent-terracotta); letter-spacing: 2px; text-transform: uppercase;">
                    Order Receipt
                </span>
                <h1 style="font-family: var(--font-heading); font-size: 30px; font-weight: 800; color: var(--primary-900);"
                    th:text="'Order #' + ${order.id}">
                    Order Details
                </h1>
            </div>

            <div>
                <span class="badge"
                      style="font-size: 13px; padding: 6px 14px;"
                      th:classappend="${order.status == 'DELIVERED' ? 'badge-status-delivered' : (order.status == 'SHIPPED' ? 'badge-status-shipped' : (order.status == 'CONFIRMED' ? 'badge-status-confirmed' : (order.status == 'CANCELLED' ? 'badge-status-cancelled' : 'badge-status-placed')))}"
                      th:text="${order.status}">
                </span>
            </div>
        </div>

        <!-- Info Grid -->
        <div class="invoice-grid">
            <!-- Customer Details Card -->
            <div class="invoice-info-card">
                <h3 class="invoice-card-title">👤 Customer Information</h3>
                <div class="info-row">
                    <span class="info-row-label">Name</span>
                    <span class="info-row-val" th:text="${order.customerName}"></span>
                </div>
                <div class="info-row">
                    <span class="info-row-label">Email</span>
                    <span class="info-row-val" th:text="${order.email}"></span>
                </div>
                <div class="info-row">
                    <span class="info-row-label">Phone</span>
                    <span class="info-row-val" th:text="${order.phone}"></span>
                </div>
                <div class="info-row">
                    <span class="info-row-label">Order Date</span>
                    <span class="info-row-val" th:text="${#temporals.format(order.orderDate, 'dd-MM-yyyy HH:mm')}"></span>
                </div>
            </div>

            <!-- Delivery Address Card -->
            <div class="invoice-info-card">
                <h3 class="invoice-card-title">📍 Shipping Destination</h3>
                <div class="info-row" style="flex-direction: column; gap: 6px;">
                    <span class="info-row-label">Delivery Address:</span>
                    <span style="font-weight: 600; color: var(--text-primary); line-height: 1.5;" th:text="${order.address}"></span>
                </div>
                <div class="info-row" style="margin-top: 10px;">
                    <span class="info-row-label">Shipping Method</span>
                    <span class="info-row-val" style="color: var(--status-success);">Eco-Compensated Express</span>
                </div>
            </div>
        </div>

        <!-- Purchased Products List -->
        <div class="items-card">
            <h3 style="font-family: var(--font-heading); font-size: 19px; font-weight: 800; color: var(--primary-900); margin-bottom: 18px;">
                Purchased Garments
            </h3>

            <div th:each="item : ${items}" class="order-item-row">
                <img class="order-item-thumb"
                     th:src="${item.product.imageUrl != null and !item.product.imageUrl.isEmpty() ? item.product.imageUrl : 'https://images.unsplash.com/photo-1523381210434-271e8be1f52b?auto=format&fit=crop&w=400&q=80'}"
                     th:alt="${item.product.name}"
                     onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1523381210434-271e8be1f52b?auto=format&fit=crop&w=400&q=80';">

                <div class="order-item-details">
                    <h4 style="font-family: var(--font-heading); font-size: 16px; font-weight: 700; color: var(--text-primary); margin-bottom: 4px;"
                        th:text="${item.product.name}"></h4>
                    <div style="font-size: 13px; color: var(--text-muted);">
                        Size: <strong th:text="${item.product.size}"></strong> •
                        Category: <span th:text="${item.product.category}"></span>
                    </div>
                    <div style="font-size: 13.5px; color: var(--text-secondary); margin-top: 4px;">
                        Quantity: <strong th:text="${item.quantity}"></strong> × ₹<span th:text="${item.price}"></span>
                    </div>
                </div>

                <div class="order-item-subtotal">
                    ₹<span th:text="${item.subtotal}"></span>
                </div>
            </div>

            <!-- Grand Total -->
            <div class="order-grand-total-box">
                <span style="font-size: 18px; font-weight: 700; color: var(--primary-900);">Total Amount Paid</span>
                <span style="font-family: var(--font-heading); font-size: 26px; font-weight: 800; color: var(--primary-900);">
                    ₹<span th:text="${order.totalAmount}"></span>
                </span>
            </div>
        </div>

    </main>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
