
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ReWear | Product Details</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f8f7f3;
            color: #263c32;
        }

        header {
            background: #263c32;
            color: white;
            padding: 22px 7%;
            font-size: 27px;
            font-weight: bold;
        }

        .container {
            max-width: 1050px;
            margin: 50px auto;
            padding: 20px;
        }

        .product-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 45px;
            background: white;
            padding: 30px;
            border-radius: 14px;
        }

        .product-image {
            width: 100%;
            height: 430px;
            object-fit: cover;
            border-radius: 10px;
        }

        h1 {
            font-size: 32px;
        }

        .price {
            font-size: 30px;
            font-weight: bold;
            color: #286044;
        }

        .condition {
            display: inline-block;
            background: #e4f0e7;
            padding: 8px 14px;
            border-radius: 20px;
        }

        .buy-button {
            display: inline-block;
            margin-top: 25px;
            padding: 15px 35px;
            background: #263c32;
            color: white;
            border-radius: 6px;
            text-decoration: none;
            border: none;
            font-size: 16px;
            cursor: pointer;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #286044;
            text-decoration: none;
            font-weight: bold;
        }

        @media(max-width: 700px) {
            .product-details {
                grid-template-columns: 1fr;
            }

            .product-image {
                height: 300px;
            }
        }
        .add-cart-btn {
            background: #222;
            color: white;
            padding: 14px 25px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.3s;
        }

        .add-cart-btn:hover {
            background: #444;
            transform: translateY(-2px);
        }
    </style>
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">

    <a class="back-link" href="/products">
        ← Back to Products
    </a>

    <div class="product-details">

        <div>
            <img class="product-image"
                 th:src="${product.imageUrl}"
                 th:alt="${product.name}">
        </div>

        <div>

            <h1 th:text="${product.name}"></h1>

            <p class="price">
                ₹<span th:text="${product.price}"></span>
            </p>

            <p th:text="${product.description}"></p>

            <p>
                <strong>Size:</strong>
                <span th:text="${product.size}"></span>
            </p>

            <p>
                <strong>Category:</strong>
                <span th:text="${product.category}"></span>
            </p>

            <p>
                <strong>Condition:</strong>
                <span class="condition"
                      th:text="${product.condition}">
                </span>
            </p>
            <form th:action="@{/cart/add/{productId}(productId=${product.id})}"
                  method="post">

                <button type="submit" class="add-cart-btn">
                    🛒 Add to Cart
                </button>

            </form>
            <a class="buy-button"
               th:href="@{/checkout/buy-now/{id}(id=${product.id})}">
                ⚡ Buy Now
            </a>

        </div>

    </div>

</div>

</body>
</html>
