
<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ReWear | Shop Fashion</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f8f7f3;
            color: #263c32;
        }

        .container {
            padding: 40px 7%;
        }

        h1 {
            font-size: 36px;
        }

        .add-product-btn {
            display: inline-block;
            background: #263c32;
            color: white;
            padding: 12px 20px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.2s;
        }

        .add-product-btn:hover {
            background: #42654f;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 25px;
        }

        .product-item {
            min-width: 0;
        }

        .product-link {
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .card {
            background: white;
            padding: 18px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #00000010;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 22px #00000018;
        }

        .product-image {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 8px;
            background: #e9e8df;
        }

        .card h3 {
            margin-bottom: 8px;
        }

        .price {
            font-size: 23px;
            font-weight: bold;
            color: #286044;
        }

        .details {
            color: #777;
            font-size: 14px;
        }

        .condition {
            display: inline-block;
            background: #e4f0e7;
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 12px;
        }

        .view-more {
            color: #286044;
            font-weight: bold;
            margin-top: 15px;
        }

        /* Edit and Delete buttons */
        .product-actions {
            display: flex;
            gap: 12px;
            margin-top: 15px;
            align-items: center;
        }

        .edit-btn,
        .delete-btn {
            flex: 1;
            padding: 11px 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.25s ease;
        }

        .edit-btn {
            background: #222;
            color: white;
            border: 1px solid #222;
        }

        .edit-btn:hover {
            background: #444;
            transform: translateY(-2px);
        }

        .delete-btn {
            background: #fff0f0;
            color: #d32f2f;
            border: 1px solid #ffcaca;
        }

        .delete-btn:hover {
            background: #d32f2f;
            color: white;
            transform: translateY(-2px);
        }

        .product-actions form {
            flex: 1;
            margin: 0;
        }

        .product-actions form button {
            width: 100%;
        }

        /* Search and filters */
        .filter-form {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 25px 0;
            align-items: center;
        }

        .filter-form input,
        .filter-form select {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        .filter-form input {
            flex: 2;
            min-width: 180px;
        }

        .filter-form select {
            flex: 1;
        }

        .filter-form button {
            padding: 12px 18px;
            background: #222;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .filter-form a {
            color: #555;
            text-decoration: none;
        }

        .empty-message {
            background: white;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            grid-column: 1 / -1;
        }

        @media(max-width: 600px) {
            .container {
                padding: 25px 5%;
            }

            h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">

    <h1>Explore Pre-loved Fashion</h1>

    <!-- Only logged-in users can add products -->
    <a sec:authorize="isAuthenticated()"
       class="add-product-btn"
       th:href="@{/products/new}">
        + Add Product
    </a>

    <p>Find your next favourite outfit at a better price.</p>

    <!-- Search and filters -->
    <form th:action="@{/products}"
          method="get"
          class="filter-form">

        <input type="text"
               name="keyword"
               placeholder="Search products..."
               th:value="${keyword}">

        <select name="category">
            <option value=""
                    th:selected="${selectedCategory == null or selectedCategory == ''}">
                All Categories
            </option>
            <option value="Men"
                    th:selected="${selectedCategory == 'Men'}">Men</option>
            <option value="Women"
                    th:selected="${selectedCategory == 'Women'}">Women</option>
            <option value="Kids"
                    th:selected="${selectedCategory == 'Kids'}">Kids</option>
            <option value="Accessories"
                    th:selected="${selectedCategory == 'Accessories'}">Accessories</option>
        </select>

        <select name="size">
            <option value=""
                    th:selected="${selectedSize == null or selectedSize == ''}">
                All Sizes
            </option>
            <option value="XS" th:selected="${selectedSize == 'XS'}">XS</option>
            <option value="S" th:selected="${selectedSize == 'S'}">S</option>
            <option value="M" th:selected="${selectedSize == 'M'}">M</option>
            <option value="L" th:selected="${selectedSize == 'L'}">L</option>
            <option value="XL" th:selected="${selectedSize == 'XL'}">XL</option>
            <option value="XXL" th:selected="${selectedSize == 'XXL'}">XXL</option>
        </select>

        <select name="sortBy">
            <option value=""
                    th:selected="${selectedSort == null or selectedSort == ''}">
                Default Sorting
            </option>
            <option value="priceLow"
                    th:selected="${selectedSort == 'priceLow'}">
                Price: Low to High
            </option>
            <option value="priceHigh"
                    th:selected="${selectedSort == 'priceHigh'}">
                Price: High to Low
            </option>
        </select>

        <button type="submit">Search &amp; Filter</button>

        <a th:href="@{/products}">Clear Filters</a>

    </form>

    <!-- Products -->
    <div class="products">

        <div class="product-item"
             th:each="product : ${products}">

            <a class="product-link"
               th:href="@{/products/{id}(id=${product.id})}">

                <div class="card">

                    <img class="product-image"
                         th:src="${product.imageUrl}"
                         th:alt="${product.name}">

                    <h3 th:text="${product.name}"></h3>

                    <p class="details"
                       th:text="${product.description}"></p>

                    <p class="price">
                        ₹<span th:text="${product.price}"></span>
                    </p>

                    <p>
                        Size: <span th:text="${product.size}"></span>
                    </p>

                    <p>
                        Category: <span th:text="${product.category}"></span>
                    </p>

                    <span class="condition"
                          th:text="${product.condition}">
                    </span>

                    <p class="view-more">View Details →</p>

                </div>

            </a>

            <!-- Only product owner or admin sees these buttons -->
            <div class="product-actions"
                 th:if="${manageableProductIds != null and manageableProductIds.contains(product.id)}">

                <a class="edit-btn"
                   th:href="@{/products/edit/{id}(id=${product.id})}">
                    ✏️ Edit
                </a>

                <form th:action="@{/products/delete/{id}(id=${product.id})}"
                      method="post"
                      onsubmit="return confirm('Are you sure you want to delete this product?');">

                    <button class="delete-btn" type="submit">
                        🗑 Delete
                    </button>

                </form>

            </div>

        </div>

        <!-- No products message -->
        <div class="empty-message"
             th:if="${#lists.isEmpty(products)}">

            <h3>No products found.</h3>
            <p>Try changing your search or filters.</p>

        </div>

    </div>

</div>

</body>
</html>
